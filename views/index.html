<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado productos</title>

     <link rel='stylesheet' href='https://cdn.jsdelivr.net/gh/kognise/water.css@latest/dist/dark.css'>
      <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
         <div id="logo-container">
            <img src="https://img.magnific.com/premium-vector/simple-burger-logo-design_375081-575.jpg?w=740" alt="logo" class="logo">
        </div>
         <nav>
            <ul>
                <li><a href="index.html">Principal</a></li>
                <li><a href="get.html">Consultar</a></li>
                <li><a href="post.html">Crear</a></li>
                <li><a href="put.html">Modificar</a></li>
                <li><a href="delete.html">Eliminar</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <h1>Listado productos</h1>
        <section id="contenedor-productos"></section>
    </main>

    
   
    <script>

        let contenedorProductos=document.getElementById("contenedor-productos");

        function mostrarError(string){
            contenedorProductos.innerHTML= `
            <p class="mensaje error">${string}</p>
            
            `;
        }

        async function obtenerProductos() {
            try{
                let url = "http://localhost:3000/api/products/";
                let response = await fetch(url);
                let data = await response.json();


                if(!response.ok){
                    console.log(data.message);
                    return mostrarError(data.message);
                }

                console.table(data.payload);
                renderizarProductos(data.payload);

            }catch(error){
                console.error(error);
                mostrarError("Error en la conexion con el servidor");

            }
        }


        function renderizarProductos(array){
            let htmlProducto = "";

            array.forEach(producto => {
                htmlProducto += `
                 <div class = "card-producto">
                      <img src = "${producto.image}" alt="${producto.name}">
                      <h3>${producto.name}</h3>
                      <p>Id: ${producto.id}</p>
                      <p>$${producto.price}</p>
                 </div>`;              
                
            })

            contenedorProductos.innerHTML = htmlProducto;
        }

        obtenerProductos();

    </script>
</body>
</html>
